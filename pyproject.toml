[project]
name = "change-order-extraction"
version = "0.1.0"
description = "Extract validated, confidence-scored JSON from messy construction change orders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "openai>=1.60",
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
    "openai-agents>=0.24.0",
]

[project.scripts]
co-extract = "co_extract.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
samples = ["reportlab>=4", "pillow>=10"]

[tool.uv]
default-groups = ["dev", "samples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
